name: Scan gazette

on:
  schedule:
    # Cyprus is UTC+3 (summer) / UTC+2 (winter). Issues are normally published on
    # Friday, but occasional mid-week issues exist, so Monday is a safety net.
    - cron: "0 19 * * 5"   # Friday ~22:00 Cyprus
    - cron: "0 6 * * 1"    # Monday ~09:00 Cyprus
  workflow_dispatch:        # "Run workflow" button

permissions:
  contents: write           # commit the updated report
  issues: write             # open an issue when something new is found

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      # Keeps already-downloaded issue PDFs between runs so each run only
      # fetches the new ones.
      - uses: actions/cache@v4
        with:
          path: scanner/cache
          key: gazette-pdfs-${{ github.run_id }}
          restore-keys: gazette-pdfs-

      - name: Scan the latest issues
        run: python poc.py --limit 20
        working-directory: scanner

      - name: Extract details with OpenAI
        working-directory: scanner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          CANDIDATE_PROFILE: ${{ vars.CANDIDATE_PROFILE }}
        run: |
          python ai.py
          python report.py   # rebuild the page with the AI fields

      - name: Decide what is new
        id: notify
        working-directory: scanner
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python notify.py

      - name: Publish the report to GitHub Pages
        run: |
          mkdir -p docs
          cp scanner/report.html docs/index.html

      - name: Commit the updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scanner docs   # ai_cache.json does not exist until the AI step runs
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "Update gazette report ($(date -u +%Y-%m-%d))"
          git push

      - name: Open an issue for the new vacancies
        if: steps.notify.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "${{ steps.notify.outputs.subject }}" --body-file scanner/notify.md
        working-directory: ${{ github.workspace }}
